version: '3.8'

services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: rag_pdf_system
    ports:
      - "8200:8000"
    volumes:
      - ../:/app
      - ../data:/app/data
      - ../logs:/app/logs
      - compose_db:/compose-db
    environment:
      - APP_ENV=development
      # SQLite WAL is unreliable on Windows bind mounts; keep runtime DBs on a Docker volume.
      - DATABASE_URL=sqlite:////compose-db/rag_system.db
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=minio:9000
      - TERMCP_ENABLED=${TERMCP_ENABLED:-false}
      - DIAGNOSTIC_ENABLED=${DIAGNOSTIC_ENABLED:-false}
      - DIAGNOSTIC_TOKEN=${DIAGNOSTIC_TOKEN:-}
      # MCP evidence services still run on the host during this single-node phase.
      # Docker Desktop exposes them through host.docker.internal from the app container.
      - MCP_MONITOR_URL=${MCP_MONITOR_URL:-http://host.docker.internal:8104/mcp}
      - MCP_CLS_URL=${MCP_CLS_URL:-http://host.docker.internal:8103/mcp}
      - MCP_RAG_URL=${MCP_RAG_URL:-http://host.docker.internal:8105/mcp}
      - MCP_CHANGE_URL=${MCP_CHANGE_URL:-http://host.docker.internal:8106/mcp}
      - MCP_TERMCP_URL=http://termcp-gateway:18766/mcp
      - MCP_DIAGNOSTIC_URL=http://diagnostic-target:8107/mcp
      - PROBE_ENABLED=${PROBE_ENABLED:-false}
      - PROBE_TARGET_ID=${PROBE_TARGET_ID:-windows-local-01}
      - PROBE_TOKEN=${PROBE_TOKEN:-}
      - MCP_PROBE_URL=http://probe-gateway:18767/mcp
      - DIAGNOSTIC_TARGET_CATALOG=${DIAGNOSTIC_TARGET_CATALOG:-}
      - TERMCP_APPROVAL_API_URL=http://termcp-gateway:18766
      - TERMCP_UI_URL=http://127.0.0.1:18765
      - TERMCP_SSH_PROFILE=test-target
      - AIOPS_CHECKPOINT_DB_PATH=/compose-db/aiops_checkpoints.sqlite
    depends_on:
      - milvus-standalone
      - redis
      - rabbitmq
    networks:
      - rag_net
      - termcp_app_net

  worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: rag_worker
    command: celery -A src.worker.celery_app worker --loglevel=info
    volumes:
      - ../:/app
      - ../data:/app/data
      - ../logs:/app/logs
      - compose_db:/compose-db
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:////compose-db/rag_system.db
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - rabbitmq
      - redis
      - milvus-standalone
    networks:
      - rag_net

  flower:
    image: mher/flower
    container_name: rag_flower
    command: celery flower
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - redis
    networks:
      - rag_net

  frontend:
    # 安全最佳实践: 生产环境使用多阶段构建 + nginx，不再用 Vite dev server
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        - VITE_API_BASE=/api/v1
    container_name: rag_frontend
    ports:
      - "5273:80"
    depends_on:
      - app
    networks:
      - rag_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rag_rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # 安全最佳实践: 生产环境必须替换默认凭据 guest/guest
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rag_net

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - rag_net

  minio:
    container_name: milvus-minio
    # 2026-10-13: minio/minio 镜像已从 Docker Hub/Quay 全量下架(社区版停止分发,匿名拉取 401)。
    # 改用维护中的无缝替代分支 pgsty/silo(接口/环境变量/S3 数据格式兼容;控制台支持中文)。
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    # 安全最佳实践: 生产环境必须替换默认凭据 minioadmin/minioadmin
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - rag_net

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - rag_net

  redis:
    container_name: rag_redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_net

  termcp:
    profiles: ["termcp"]
    image: aiops-termcp:0.2.7-expiry.1
    build:
      context: ../
      dockerfile: docker/termcp/patched.Dockerfile
    command: ["termcp", "--host", "0.0.0.0", "--port", "18765", "--data-dir", "/home/termcp", "--no-internal"]
    environment:
      TERMCP_AUTH_TOKEN: ${TERMCP_TOKEN:-}
    volumes:
      - termcp_data:/home/termcp
      - ../data/termcp/ssh_configs:/home/termcp/ssh_configs:ro
    ports:
      - "127.0.0.1:18765:18765"
    networks:
      - termcp_backend_net

  termcp-gateway:
    profiles: ["termcp"]
    build:
      context: ../
      dockerfile: docker/termcp/gateway.Dockerfile
    environment:
      TERMCP_INTERNAL_URL: http://termcp:18765
      TERMCP_TOKEN: ${TERMCP_TOKEN:-}
      TERMCP_SSH_PROFILE: test-target
    networks:
      - termcp_app_net
      - termcp_backend_net
    depends_on:
      - termcp

  diagnostic-target:
    profiles: ["termcp"]
    build:
      context: ../
      dockerfile: docker/diagnostic/Dockerfile
    environment:
      DIAGNOSTIC_EXEC_ENABLED: ${DIAGNOSTIC_EXEC_ENABLED:-false}
      DIAGNOSTIC_TOKEN: ${DIAGNOSTIC_TOKEN:-}
      DIAGNOSTIC_SSH_CONFIG: /connection/target.json
      DIAGNOSTIC_ALLOWED_DEPENDENCIES: ${DIAGNOSTIC_ALLOWED_DEPENDENCIES:-}
      DIAGNOSTIC_EVIDENCE_DIR: /evidence
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp:./diagnostic/seccomp.json
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ../data/aiops-evidence:/evidence:rw
      - ../data/diagnostic-connection:/connection:ro
    networks:
      - termcp_app_net

  probe-gateway:
    profiles: ["termcp"]
    build:
      context: ../
      dockerfile: docker/probe/gateway.Dockerfile
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:////compose-db/rag_system.db
      - PROBE_TARGET_ID=${PROBE_TARGET_ID:-windows-local-01}
      - PROBE_TOKEN=${PROBE_TOKEN:-}
      - PROBE_STALE_SECONDS=${PROBE_STALE_SECONDS:-180}
    volumes:
      - compose_db:/compose-db
      - ../data/aiops-evidence:/app/data/aiops-evidence
    expose:
      - "18767"
    networks:
      - termcp_app_net

networks:
  rag_net:
    driver: bridge
  termcp_app_net:
    driver: bridge
    internal: true
  termcp_backend_net:
    driver: bridge

volumes:
  compose_db:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  redis_data:
  rabbitmq_data:
  termcp_data:

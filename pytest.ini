[pytest]
# 测试发现范围:仅 tests/(避免误收集 frontend/learning 等第三方目录)
testpaths = tests

# pytest-asyncio:显式声明异步 fixture 的默认事件循环作用域,
# 消除 PytestDeprecationWarning(asyncio_default_fixture_loop_scope is unset)。
# 现有 fixture 均为同步 pytest.fixture,无异步 session 级 fixture,故 function 作用域安全。
asyncio_default_fixture_loop_scope = function

# 自定义 marker 注册(未注册会触发 PytestUnknownMarkWarning)
markers =
    integration: 依赖外部服务(PostgreSQL / Redis / Elasticsearch / Milvus / 网络)的集成测试;默认不执行,用 `pytest -m integration` 单独运行

# 默认只跑离线单测:CI 与本地 `pytest` 均无需外部服务即可全绿。
# 需要跑集成测试时显式覆盖: `pytest -m integration`
addopts = -ra -m "not integration"
